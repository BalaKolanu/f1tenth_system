imu_odom_fusion_node:
  ros__parameters:
    imu_topic: "/sensors/imu/raw"
    wheel_odom_topic: "/odom"
    fused_odom_topic: "/odometry/imu_fused"
    odom_frame: "odom"
    base_frame: "base_link"
    imu_frame_id: "imu_frame"
    publish_tf: true
    linear_speed_scale: 1.0
    use_first_imu_as_zero: true
    yaw_offset_rad: 0.0
    yaw_alpha: 0.3
    max_dt_sec: 0.2
    accel_fusion_mode: "off"
    use_accel_fusion: false
    wheel_speed_alpha: 0.85
    accel_lowpass_alpha: 0.25
    stationary_bias_alpha: 0.02
    estimate_imu_bias: true
    max_accel_mps2: 4.0
    zero_velocity_speed_threshold: 0.05
    zero_velocity_accel_threshold: 0.25
    use_imu_angular_velocity: true
