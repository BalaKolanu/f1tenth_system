/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    speed_to_erpm_gain: 3278.071192
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) = steering_angle_to_servo_gain * steering angle (radians)
    # + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.5000

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: 0.0
    brake_max: 200000.0
    speed_min: -50000.0
    speed_max: 50000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.0
    servo_max: 1.0
    # The onboard VESC IMU is the car's primary IMU source.
    publish_imu: true
    brake_speed_holdoff_sec: 0.10

ackermann_to_vesc_node:
  ros__parameters:
    command_timeout_sec: 0.25
    command_timeout_brake_current: 0.0
    active_braking_enabled: false
    runtime_active_braking_default_enabled: false
    active_braking_enable_topic: /safety/vesc_active_braking_enabled
    active_braking_enable_timeout_sec: 0.5
    active_brake_min_current: 1.0
    active_brake_max_current: 9.0
    brake_current_per_decel: 1.2
    brake_current_per_speed_error: 2.4
    default_decel_mps2: 1.0
    brake_enter_speed_error_mps: 0.05
    brake_release_speed_error_mps: 0.02
    brake_min_vehicle_speed_mps: 0.05
    brake_current_slew_rate_aps: 40.0
    vesc_state_topic: sensors/core
    vesc_state_timeout_sec: 0.25

vesc_to_odom_node:
  ros__parameters:
    # vesc_to_odom applies an internal leading minus on raw motor speed.
    # Use negative gain here so forward vehicle motion yields +x odom.
    speed_to_erpm_gain: -3278.071192
    speed_to_erpm_offset: 0.0
    odom_frame: odom
    base_frame: base_link
    # PF owns map->base_link TF during localization; do not also publish raw odom TF.
    publish_tf: false
    # PF now consumes raw /odom, so VESC odom must include steering-derived yaw.
    use_servo_cmd_to_calc_angular_velocity: true
    wheelbase: .324

throttle_interpolator:
  ros__parameters:
    input_topic: commands/motor/unsmoothed_speed
    output_topic: commands/motor/speed
    publish_hz: 100.0
    launch_enabled: true
    launch_duration_sec: 1.0
    launch_autonomy_only: true
    autonomy_enabled_topic: /safety/autonomy_enabled
    launch_floor_erpm: 3500.0
    launch_start_speed_mps: 0.05
    launch_reset_speed_mps: 0.02
    launch_profile_time_points_sec: [0.0, 0.05, 0.12, 0.20, 0.32, 0.48, 0.66, 0.82, 1.0]
    launch_profile_scale_points: [0.0, 0.008, 0.03, 0.08, 0.18, 0.36, 0.60, 0.84, 1.0]
    max_acceleration_mps2: 0.5
